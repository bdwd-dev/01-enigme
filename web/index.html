<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>L'Énigme — Bien-être & Intimité</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    
    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #222; position: sticky; top: 0; background: #0a0a0a; z-index: 100; }
    .logo { font-size: 24px; font-weight: bold; color: #e91e63; display: flex; align-items: center; gap: 8px; }
    .nav { display: flex; gap: 24px; align-items: center; }
    .nav a { color: #aaa; text-decoration: none; font-size: 14px; transition: color 0.2s; }
    .nav a:hover { color: #e91e63; }
    .cart-btn { background: #e91e63; color: #fff; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 6px; }
    .cart-btn:hover { background: #c2185b; }
    .cart-count { background: #fff; color: #e91e63; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
    
    /* Hero */
    .hero { text-align: center; padding: 80px 20px; }
    .hero h1 { font-size: 42px; margin-bottom: 16px; background: linear-gradient(135deg, #e91e63, #ff5722); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { color: #888; font-size: 18px; max-width: 600px; margin: 0 auto 30px; line-height: 1.6; }
    .btn { background: #e91e63; color: #fff; border: none; padding: 14px 32px; border-radius: 8px; font-size: 16px; cursor: pointer; transition: all 0.2s; }
    .btn:hover { background: #c2185b; transform: translateY(-2px); }
    .btn-outline { background: transparent; border: 2px solid #e91e63; color: #e91e63; }
    .btn-outline:hover { background: #e91e63; color: #fff; }
    
    /* Trust Badges */
    .trust-badges { display: flex; justify-content: center; gap: 40px; padding: 40px 0; flex-wrap: wrap; }
    .badge { display: flex; align-items: center; gap: 8px; color: #888; font-size: 14px; }
    .badge-icon { font-size: 24px; }
    
    /* Categories */
    .categories { display: flex; gap: 12px; padding: 30px 0; flex-wrap: wrap; }
    .category-chip { background: #1a1a1a; border: 1px solid #333; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
    .category-chip:hover, .category-chip.active { background: #e91e63; border-color: #e91e63; }
    
    /* Products Grid */
    .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; padding: 30px 0; }
    .product-card { background: #141414; border-radius: 16px; padding: 24px; border: 1px solid #222; transition: all 0.3s; }
    .product-card:hover { border-color: #e91e63; transform: translateY(-4px); box-shadow: 0 10px 30px rgba(233, 30, 99, 0.1); }
    .product-image { width: 100%; height: 180px; background: linear-gradient(135deg, #1a1a1a, #2a2a2a); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 48px; margin-bottom: 16px; }
    .product-category { font-size: 11px; color: #e91e63; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .product-name { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .product-desc { color: #777; font-size: 13px; margin-bottom: 16px; line-height: 1.5; }
    .product-footer { display: flex; justify-content: space-between; align-items: center; }
    .product-price { font-size: 22px; font-weight: bold; color: #e91e63; }
    .add-btn { background: #e91e63; color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; }
    .add-btn:hover { background: #c2185b; }
    
    /* Cart Sidebar */
    .cart-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; }
    .cart-overlay.open { display: block; }
    .cart-sidebar { position: fixed; top: 0; right: -450px; width: 450px; max-width: 100%; height: 100%; background: #141414; z-index: 201; transition: right 0.3s; display: flex; flex-direction: column; }
    .cart-sidebar.open { right: 0; }
    .cart-header { padding: 24px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    .cart-header h2 { font-size: 20px; }
    .close-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
    .cart-items { flex: 1; overflow-y: auto; padding: 20px; }
    .cart-item { display: flex; gap: 16px; padding: 16px 0; border-bottom: 1px solid #222; }
    .cart-item-image { width: 60px; height: 60px; background: #222; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .cart-item-info { flex: 1; }
    .cart-item-name { font-weight: 600; margin-bottom: 4px; }
    .cart-item-price { color: #e91e63; font-size: 14px; }
    .cart-item-qty { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
    .qty-btn { background: #333; border: none; color: #fff; width: 28px; height: 28px; border-radius: 4px; cursor: pointer; }
    .cart-footer { padding: 24px; border-top: 1px solid #333; }
    .cart-total { display: flex; justify-content: space-between; font-size: 20px; font-weight: bold; margin-bottom: 16px; }
    .checkout-btn { width: 100%; background: #e91e63; color: #fff; border: none; padding: 16px; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .checkout-btn:hover { background: #c2185b; }
    .empty-cart { text-align: center; padding: 60px 20px; color: #666; }
    .empty-cart-icon { font-size: 64px; margin-bottom: 16px; }
    
    /* Checkout */
    .checkout-form { padding: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 14px; color: #888; margin-bottom: 6px; }
    .form-input { width: 100%; background: #222; border: 1px solid #333; padding: 12px; border-radius: 8px; color: #fff; font-size: 14px; }
    .form-input:focus { outline: none; border-color: #e91e63; }
    .delivery-options { display: flex; gap: 12px; margin-bottom: 16px; }
    .delivery-option { flex: 1; background: #222; border: 2px solid #333; padding: 16px; border-radius: 8px; cursor: pointer; text-align: center; }
    .delivery-option.selected { border-color: #e91e63; }
    .delivery-option-icon { font-size: 24px; margin-bottom: 8px; }
    .delivery-option-name { font-weight: 600; font-size: 14px; }
    .delivery-option-desc { font-size: 12px; color: #888; margin-top: 4px; }
    
    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 40px 0; }
    .stat-card { background: #141414; border-radius: 12px; padding: 20px; text-align: center; border: 1px solid #222; }
    .stat-value { font-size: 28px; font-weight: bold; color: #e91e63; }
    .stat-label { font-size: 12px; color: #888; margin-top: 4px; }
    
    /* Footer */
    .footer { text-align: center; padding: 40px 0; color: #555; font-size: 13px; border-top: 1px solid #222; margin-top: 60px; }
    .footer-links { display: flex; justify-content: center; gap: 24px; margin-bottom: 16px; }
    .footer-links a { color: #888; text-decoration: none; }
    .footer-links a:hover { color: #e91e63; }
    
    /* Responsive */
    @media (max-width: 768px) {
      .hero h1 { font-size: 28px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .trust-badges { gap: 20px; }
      .nav a { display: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;
    const API = 'https://zero1-enigme-backend.onrender.com/api';

    // Toast notification
    function Toast({ message, onClose }) {
      useEffect(() => {
        const timer = setTimeout(onClose, 3000);
        return () => clearTimeout(timer);
      }, [onClose]);
      return (
        <div style={{ position: 'fixed', bottom: 20, right: 20, background: '#e91e63', color: '#fff', padding: '12px 24px', borderRadius: 8, zIndex: 9999, animation: 'slideIn 0.3s' }}>
          {message}
        </div>
      );
    }

    // Product Card
    function ProductCard({ product, onAdd }) {
      return (
        <div className="product-card">
          <div className="product-image">🎁</div>
          <div className="product-category">{product.category}</div>
          <div className="product-name">{product.name}</div>
          <div className="product-desc">{product.description}</div>
          <div className="product-footer">
            <div className="product-price">{product.price?.toLocaleString()} F</div>
            <button className="add-btn" onClick={() => onAdd(product)}>+</button>
          </div>
        </div>
      );
    }

    // Cart Sidebar
    function Cart({ isOpen, onClose, items, onUpdateQty, onRemove, onCheckout }) {
      const [step, setStep] = useState('cart'); // cart, checkout, success
      const [deliveryMethod, setDeliveryMethod] = useState('delivery');
      const [form, setForm] = useState({ name: '', phone: '', address: '', notes: '' });
      
      const subtotal = items.reduce((s, i) => s + i.price * i.qty, 0);
      const deliveryFee = subtotal >= 20000 ? 0 : 2500;
      const total = subtotal + deliveryFee;

      const handleSubmit = () => {
        if (!form.name || !form.phone) {
          alert('Veuillez remplir votre nom et téléphone');
          return;
        }
        if (deliveryMethod === 'delivery' && !form.address) {
          alert('Veuillez indiquer une adresse de livraison');
          return;
        }
        onCheckout({ ...form, delivery_method: deliveryMethod, items, total });
        setStep('success');
      };

      if (step === 'success') {
        return (
          <div className={`cart-sidebar ${isOpen ? 'open' : ''}`}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100%', flexDirection: 'column', padding: 40, textAlign: 'center' }}>
              <div style={{ fontSize: 64, marginBottom: 20 }}>✅</div>
              <h2 style={{ marginBottom: 12 }}>Commande confirmée !</h2>
              <p style={{ color: '#888', marginBottom: 24 }}>Nous vous contacterons par WhatsApp pour confirmer votre commande.</p>
              <button className="btn" onClick={() => { setStep('cart'); onClose(); }}>Continuer mes achats</button>
            </div>
          </div>
        );
      }

      return (
        <div className={`cart-sidebar ${isOpen ? 'open' : ''}`}>
          <div className="cart-header">
            <h2>{step === 'cart' ? `Panier (${items.length})` : 'Finaliser'}</h2>
            <button className="close-btn" onClick={onClose}>×</button>
          </div>
          
          {step === 'cart' && (
            <>
              <div className="cart-items">
                {items.length === 0 ? (
                  <div className="empty-cart">
                    <div className="empty-cart-icon">🛒</div>
                    <p>Votre panier est vide</p>
                  </div>
                ) : (
                  items.map((item, idx) => (
                    <div key={idx} className="cart-item">
                      <div className="cart-item-image">🎁</div>
                      <div className="cart-item-info">
                        <div className="cart-item-name">{item.name}</div>
                        <div className="cart-item-price">{item.price?.toLocaleString()} F</div>
                        <div className="cart-item-qty">
                          <button className="qty-btn" onClick={() => onUpdateQty(idx, item.qty - 1)}>-</button>
                          <span>{item.qty}</span>
                          <button className="qty-btn" onClick={() => onUpdateQty(idx, item.qty + 1)}>+</button>
                          <button className="qty-btn" onClick={() => onRemove(idx)} style={{ marginLeft: 'auto', color: '#e91e63' }}>🗑</button>
                        </div>
                      </div>
                    </div>
                  ))
                )}
              </div>
              {items.length > 0 && (
                <div className="cart-footer">
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
                    <span style={{ color: '#888' }}>Sous-total</span>
                    <span>{subtotal.toLocaleString()} F</span>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
                    <span style={{ color: '#888' }}>Livraison</span>
                    <span style={{ color: deliveryFee === 0 ? '#4caf50' : '#fff' }}>{deliveryFee === 0 ? 'GRATUIT' : `${deliveryFee.toLocaleString()} F`}</span>
                  </div>
                  <div className="cart-total">
                    <span>Total</span>
                    <span style={{ color: '#e91e63' }}>{total.toLocaleString()} F</span>
                  </div>
                  <button className="checkout-btn" onClick={() => setStep('checkout')}>Passer commande</button>
                </div>
              )}
            </>
          )}

          {step === 'checkout' && (
            <div className="checkout-form">
              <div className="form-group">
                <label className="form-label">Nom (ou pseudo)</label>
                <input className="form-input" value={form.name} onChange={e => setForm({...form, name: e.target.value})} placeholder="Votre nom" />
              </div>
              <div className="form-group">
                <label className="form-label">Téléphone (WhatsApp)</label>
                <input className="form-input" value={form.phone} onChange={e => setForm({...form, phone: e.target.value})} placeholder="+242 06 ..." />
              </div>
              
              <label className="form-label">Mode de livraison</label>
              <div className="delivery-options">
                <div className={`delivery-option ${deliveryMethod === 'delivery' ? 'selected' : ''}`} onClick={() => setDeliveryMethod('delivery')}>
                  <div className="delivery-option-icon">🚗</div>
                  <div className="delivery-option-name">Livraison</div>
                  <div className="delivery-option-desc">Gratuit dès 20.000 F</div>
                </div>
                <div className={`delivery-option ${deliveryMethod === 'click-collect' ? 'selected' : ''}`} onClick={() => setDeliveryMethod('click-collect')}>
                  <div className="delivery-option-icon">🏪</div>
                  <div className="delivery-option-name">Click & Collect</div>
                  <div className="delivery-option-desc">Retrait discret</div>
                </div>
              </div>

              {deliveryMethod === 'delivery' && (
                <div className="form-group">
                  <label className="form-label">Adresse de livraison</label>
                  <input className="form-input" value={form.address} onChange={e => setForm({...form, address: e.target.value})} placeholder="Quartier, point de repère..." />
                </div>
              )}

              <div className="form-group">
                <label className="form-label">Notes (optionnel)</label>
                <input className="form-input" value={form.notes} onChange={e => setForm({...form, notes: e.target.value})} placeholder="Instructions particulières..." />
              </div>

              <div style={{ background: '#1a1a1a', padding: 16, borderRadius: 8, marginBottom: 16 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
                  <span style={{ color: '#888' }}>Total à payer</span>
                  <span style={{ fontSize: 20, fontWeight: 'bold', color: '#e91e63' }}>{total.toLocaleString()} F</span>
                </div>
                <p style={{ fontSize: 12, color: '#666' }}>Paiement par Mobile Money à la livraison</p>
              </div>

              <div style={{ display: 'flex', gap: 12 }}>
                <button className="btn btn-outline" style={{ flex: 1 }} onClick={() => setStep('cart')}>Retour</button>
                <button className="btn" style={{ flex: 1 }} onClick={handleSubmit}>Confirmer</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Main App
    function App() {
      const [products, setProducts] = useState([]);
      const [categories, setCategories] = useState([]);
      const [selectedCategory, setSelectedCategory] = useState(null);
      const [cart, setCart] = useState([]);
      const [cartOpen, setCartOpen] = useState(false);
      const [stats, setStats] = useState({});
      const [toast, setToast] = useState(null);

      useEffect(() => {
        fetch(`${API}/products`).then(r => r.json()).then(setProducts);
        fetch(`${API}/categories`).then(r => r.json()).then(setCategories);
        fetch(`${API}/stats`).then(r => r.json()).then(setStats);
      }, []);

      const addToCart = (product) => {
        setCart(prev => {
          const existing = prev.find(i => i.id === product.id);
          if (existing) {
            return prev.map(i => i.id === product.id ? {...i, qty: i.qty + 1} : i);
          }
          return [...prev, {...product, qty: 1}];
        });
        setToast(`${product.name} ajouté au panier`);
      };

      const updateQty = (idx, qty) => {
        if (qty <= 0) return removeFromCart(idx);
        setCart(prev => prev.map((i, iIdx) => iIdx === idx ? {...i, qty} : i));
      };

      const removeFromCart = (idx) => {
        setCart(prev => prev.filter((_, i) => i !== idx));
      };

      const checkout = async (orderData) => {
        try {
          const res = await fetch(`${API}/orders`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(orderData)
          });
          if (res.ok) {
            setCart([]);
            fetch(`${API}/stats`).then(r => r.json()).then(setStats);
          }
        } catch (e) {
          alert('Erreur lors de la commande');
        }
      };

      const filteredProducts = selectedCategory 
        ? products.filter(p => p.category === selectedCategory)
        : products;

      return (
        <div>
          {/* Header */}
          <header className="header">
            <div className="logo">🔞 L'Énigme</div>
            <nav className="nav">
              <a href="#catalogue">Catalogue</a>
              <a href="#livraison">Livraison</a>
              <a href="#contact">Contact</a>
              <button className="cart-btn" onClick={() => setCartOpen(true)}>
                🛒 {cart.length > 0 && <span className="cart-count">{cart.length}</span>}
              </button>
            </nav>
          </header>

          <div className="container">
            {/* Hero */}
            <section className="hero">
              <h1>Bien-être & Intimité</h1>
              <p>Produits premium pour couples — Livraison gratuite et 100% anonyme partout à Brazzaville</p>
              <button className="btn" onClick={() => document.getElementById('catalogue').scrollIntoView({behavior: 'smooth'})}>
                Découvrir le catalogue
              </button>
            </section>

            {/* Trust Badges */}
            <div className="trust-badges">
              <div className="badge">
                <span className="badge-icon">🔒</span>
                <span>Emballage 100% anonyme</span>
              </div>
              <div className="badge">
                <span className="badge-icon">🚗</span>
                <span>Livraison gratuite dès 20k</span>
              </div>
              <div className="badge">
                <span className="badge-icon">💬</span>
                <span>Paiement MoMo à la livraison</span>
              </div>
            </div>

            {/* Stats */}
            <div className="stats">
              <div className="stat-card">
                <div className="stat-value">{stats.products || 0}</div>
                <div className="stat-label">Produits</div>
              </div>
              <div className="stat-card">
                <div className="stat-value">{stats.orders || 0}</div>
                <div className="stat-label">Commandes</div>
              </div>
              <div className="stat-card">
                <div className="stat-value">{stats.customers || 0}</div>
                <div className="stat-label">Clients satisfaits</div>
              </div>
              <div className="stat-card">
                <div className="stat-value">{stats.revenue ? `${(stats.revenue/1000).toFixed(0)}k` : 0}</div>
                <div className="stat-label">CA (XAF)</div>
              </div>
            </div>

            {/* Categories */}
            <div className="categories" id="catalogue">
              <div className={`category-chip ${!selectedCategory ? 'active' : ''}`} onClick={() => setSelectedCategory(null)}>
                Tous
              </div>
              {categories.map(c => (
                <div key={c.id} className={`category-chip ${selectedCategory === c.id ? 'active' : ''}`} onClick={() => setSelectedCategory(c.id)}>
                  {c.name} ({c.count})
                </div>
              ))}
            </div>

            {/* Products */}
            <div className="products">
              {filteredProducts.map(p => (
                <ProductCard key={p.id} product={p} onAdd={addToCart} />
              ))}
            </div>
          </div>

          {/* Cart */}
          <div className={`cart-overlay ${cartOpen ? 'open' : ''}`} onClick={() => setCartOpen(false)} />
          <Cart 
            isOpen={cartOpen} 
            onClose={() => setCartOpen(false)} 
            items={cart} 
            onUpdateQty={updateQty}
            onRemove={removeFromCart}
            onCheckout={checkout}
          />

          {/* Footer */}
          <footer className="footer">
            <div className="footer-links">
              <a href="#">Conditions générales</a>
              <a href="#">Politique de confidentialité</a>
              <a href="#">Contact WhatsApp</a>
            </div>
            <p>🔒 Emballage 100% anonyme • Livraison gratuite • Paiement Mobile Money</p>
            <p style={{ marginTop: 8 }}>© 2026 L'Énigme — Brazzaville, Congo</p>
          </footer>

          {/* Toast */}
          {toast && <Toast message={toast} onClose={() => setToast(null)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
